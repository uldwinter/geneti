<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0d12"><title>CircuPass — Digital Product Passport</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0d12;color:#f5f7f8;font:16px system-ui}.loader{width:min(480px,90vw);padding:32px;border:1px solid #29313d;border-radius:22px;background:#131820}.mark{width:48px;height:48px;border-radius:14px;background:#78f0a6;color:#07100b;display:grid;place-items:center;font-weight:900;font-size:24px}.bar{height:5px;background:#252d38;border-radius:99px;overflow:hidden;margin-top:22px}.bar i{display:block;width:45%;height:100%;background:#78f0a6;border-radius:99px;animation:load 1s infinite alternate}@keyframes load{to{transform:translateX(120%)}}p{color:#9ba5b1;line-height:1.6}</style></head><body><main class="loader" id="loader"><div class="mark">C</div><h1>CircuPass</h1><p>Загружается рабочая область цифровых паспортов продукции…</p><div class="bar"><i></i></div></main><script>
(async()=>{const parts=Array.from({length:14},(_,i)=>`bundle/part-${String(i+1).padStart(2,'0')}.txt`);const bases=['./','https://cdn.jsdelivr.net/gh/uldwinter/geneti@circupass/','https://raw.githubusercontent.com/uldwinter/geneti/circupass/'];async function get(path){for(const base of bases){try{const r=await fetch(base+path+'?v=20260801-3',{cache:'no-store'});if(r.ok)return await r.text()}catch{}}throw new Error(path)}try{const html=(await Promise.all(parts.map(get))).join('');document.open();document.write(html);document.close()}catch(e){document.getElementById('loader').innerHTML='<div class="mark">!</div><h1>Не удалось загрузить CircuPass</h1><p>Обновите страницу. Если ошибка повторится, проверьте доступ к GitHub CDN.</p>'}})();
</script></body></html>
